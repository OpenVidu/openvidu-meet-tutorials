<!doctype html>
<html lang="en">
	<head>
		<title>OpenVidu Meet | Direct Link Tutorial</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
		/>
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<!-- TOP APP BAR -->
		<header class="ov-appbar">
			<img class="ov-appbar__logo" src="images/meet_logo.png" alt="OpenVidu Meet" />
			<span class="ov-appbar__divider"></span>
			<span class="ov-appbar__tag">Direct Link Tutorial</span>
		</header>

		<!-- HOME VIEW -->
		<main id="home" class="ov-page">
			<div class="ov-panels">
				<!-- Rooms list section -->
				<section id="rooms-container" class="ov-card">
					<h2 class="ov-card__title">Access a Room</h2>

					<div id="rooms-list" class="ov-card__body">
						<!-- Message when there are no rooms or an error occurs while loading -->
						<p id="no-rooms-or-error" class="ov-muted" hidden></p>

						<ul class="ov-list">
							<!-- Rooms will be dynamically added here -->
						</ul>
					</div>
				</section>

				<!-- Create room section -->
				<section id="create-room" class="ov-card">
					<h2 class="ov-card__title">Create a New Room</h2>

					<form onsubmit="createRoom(event)">
						<div class="ov-field">
							<label for="room-name" class="ov-label">Room name</label>
							<input
								type="text"
								name="roomName"
								id="room-name"
								class="ov-input"
								placeholder="Example Room"
								required
							/>
						</div>

						<!-- Error message -->
						<div id="create-room-error" class="ov-alert ov-alert--error" hidden></div>

						<button type="submit" class="ov-btn ov-btn--primary ov-btn--block">Create Room</button>
					</form>
				</section>
			</div>
		</main>

		<script src="js/app.js"></script>
	</body>
</html>
