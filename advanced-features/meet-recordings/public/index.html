<!doctype html>
<html lang="en">
	<head>
		<title>OpenVidu Meet | Recordings Tutorial</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
		/>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<!-- TOP APP BAR -->
		<header class="ov-appbar">
			<img class="ov-appbar__logo" src="images/meet_logo.png" alt="OpenVidu Meet" />
			<span class="ov-appbar__divider"></span>
			<span class="ov-appbar__tag">Recordings Tutorial</span>
		</header>

		<!-- HOME VIEW -->
		<main id="home" class="ov-page">
			<div class="ov-panels">
				<!-- Rooms list section -->
				<section id="rooms-container" class="ov-card">
					<h2 class="ov-card__title">
						<span class="material-symbols-outlined ov-icon--rooms">video_chat</span>Rooms
					</h2>

					<div id="rooms-list" class="ov-card__body">
						<!-- Message when there are no rooms or an error occurs while loading -->
						<p id="no-rooms-or-error" class="ov-muted" hidden></p>

						<ul class="ov-list">
							<!-- Rooms will be dynamically added here -->
						</ul>
					</div>
				</section>

				<!-- Create room section -->
				<section id="create-room" class="ov-card">
					<h2 class="ov-card__title">
						<span class="material-symbols-outlined ov-icon--rooms">add</span>Create a new room
					</h2>

					<form onsubmit="createRoom(event)">
						<div class="ov-field">
							<label for="room-name" class="ov-label">Room name</label>
							<input
								type="text"
								name="roomName"
								id="room-name"
								class="ov-input"
								placeholder="e.g. Example Room"
								required
							/>
						</div>

						<!-- Error message -->
						<div id="create-room-error" class="ov-alert ov-alert--error" hidden></div>

						<button type="submit" class="ov-btn ov-btn--primary ov-btn--block">Create Room</button>
					</form>
				</section>
			</div>
		</main>

		<!-- ROOM VIEW -->
		<main id="room" class="ov-room-view" hidden>
			<!-- Header section with room name and end meeting button (only visible for moderators) -->
			<div id="room-header" class="ov-room-header" hidden>
				<div class="ov-room-header__info">
					<img class="ov-room-header__logo" src="images/meet_logo.png" alt="OpenVidu Meet" />
					<span class="ov-room-header__divider"></span>
					<span class="ov-live-dot" aria-hidden="true"></span>
					<span id="room-name-header" class="ov-room-header__name"></span>
					<span id="room-role-badge" class="ov-badge"></span>
				</div>
				<button id="end-meeting-btn" type="button" class="ov-btn ov-btn--danger ov-btn--sm" hidden>
					<span class="material-symbols-outlined">call_end</span>
					End meeting
				</button>
			</div>

			<div id="meet-container">
				<!-- The OpenVidu Meet WebComponent will be inserted here when an individual accesses a room -->
			</div>
		</main>

		<!-- RECORDINGS VIEW -->
		<main id="recordings" class="ov-page" hidden>
			<section class="ov-card ov-subscreen ov-subscreen--wide">
				<header class="ov-subscreen__header">
					<button type="button" class="ov-icon-btn" title="Back" onclick="backToHome()">
						<span class="material-symbols-outlined">arrow_back</span>
					</button>
					<h2 class="ov-subscreen__title">
						<span class="material-symbols-outlined ov-icon--recordings">video_library</span>Recordings
					</h2>
					<button
						id="refresh-recordings"
						type="button"
						class="ov-icon-btn"
						title="Refresh"
						onclick="listRecordings()"
					>
						<span class="material-symbols-outlined">refresh</span>
					</button>
				</header>

				<form id="filter-by-room" class="ov-search" onsubmit="listRecordings(event)">
					<input id="recordings-room-search" type="text" class="ov-input" placeholder="Room name" />
					<button type="submit" class="ov-btn ov-btn--primary" title="Search">
						<span class="material-symbols-outlined">search</span>
					</button>
				</form>

				<div id="recordings-list" class="ov-card__body">
					<!-- Message when there are no recordings or an error occurs while loading -->
					<p id="no-recordings-or-error" class="ov-muted" hidden></p>

					<ul class="ov-list">
						<!-- Recordings will be dynamically added here -->
					</ul>
				</div>
			</section>
		</main>

		<!-- DISPLAY RECORDING VIEW -->
		<main id="display-recording" class="ov-room-view" hidden>
			<!-- The OpenVidu Meet WebComponent will be inserted here when an individual displays a recording -->
		</main>

		<script src="js/app.js"></script>
		<!-- OpenVidu Meet WebComponent bundle -->
		<script src="http://localhost:9080/meet/v1/openvidu-meet.js"></script>
	</body>
</html>
