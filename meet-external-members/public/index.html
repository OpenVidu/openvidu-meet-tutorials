<!doctype html>
<html lang="es">
	<head>
		<title>OpenVidu Meet External Members Tutorial</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<!-- HOME VIEW -->
		<div id="home" class="container">
			<!-- Rooms list section -->
			<div id="rooms-container">
				<div id="rooms-header">
					<h2 class="text-center text-primary">Rooms</h2>
				</div>

				<div id="rooms-list">
					<!-- Message when there are no rooms or an error occurs while loading -->
					<p id="no-rooms-or-error" class="text-muted text-center" hidden></p>

					<ul class="list-group">
						<!-- Rooms will be dynamically added here -->
					</ul>
				</div>
			</div>

			<!-- Create room section -->
			<div id="create-room">
				<h2 class="text-center text-primary">Create a New Room</h2>

				<form onsubmit="createRoom(event)">
					<div class="mb-3">
						<label for="room-name" class="form-label">Room name</label>
						<input
							type="text"
							name="roomName"
							id="room-name"
							class="form-control"
							placeholder="Example Room"
							required
						/>
					</div>

					<!-- Error message -->
					<div id="create-room-error" class="alert alert-danger" hidden></div>

					<button type="submit" class="btn btn-primary w-100">Create Room</button>
				</form>
			</div>
		</div>

		<!-- MEMBERS VIEW -->
		<div id="members" hidden>
			<div id="members-header">
				<button class="icon-button" title="Back" onclick="backToHome()">
					<i class="fa-solid fa-arrow-left"></i>
				</button>
				<h2 id="members-room-name" class="text-primary"></h2>
			</div>

			<!-- Add external member form -->
			<form id="add-member-form" onsubmit="addMember(event)">
				<input type="text" id="member-name" class="form-control" placeholder="Member name (e.g. Charlie)" required />
				<select id="member-role" class="form-select">
					<option value="speaker">Speaker</option>
					<option value="moderator">Moderator</option>
				</select>
				<button type="submit" class="btn btn-success">Add member</button>
			</form>

			<!-- Error message -->
			<div id="add-member-error" class="alert alert-danger" hidden></div>

			<!-- Members list -->
			<div id="members-list">
				<!-- Message when there are no members or an error occurs while loading -->
				<p id="no-members-or-error" class="text-muted text-center" hidden></p>

				<ul class="list-group">
					<!-- Members will be dynamically added here -->
				</ul>
			</div>

			<p class="members-hint text-muted">
				Each external member has a <strong>unique</strong> access link. Deliver it privately to the intended
				person; anyone opening it joins the meeting as that member, with no login required.
			</p>
		</div>

		<!-- ROOM VIEW -->
		<div id="room" hidden>
			<div id="meeting-container">
				<!-- The OpenVidu Meet WebComponent will be inserted here when user joins a room -->
				<!-- <openvidu-meet room-url="..."></openvidu-meet>-->
			</div>
		</div>

		<script src="js/app.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<!-- OpenVidu Meet WebComponent bundle -->
		<script src="http://localhost:9080/meet/v1/openvidu-meet.js"></script>
	</body>
</html>
