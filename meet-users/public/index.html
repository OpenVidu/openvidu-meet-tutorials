<!doctype html>
<html lang="es">
	<head>
		<title>OpenVidu Meet Users Tutorial</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<!-- HOME VIEW -->
		<div id="home" class="container">
			<!-- Users panel -->
			<div class="panel">
				<h2 class="text-center text-primary">Users</h2>

				<div class="panel-list">
					<!-- Message when there are no users or an error occurs while loading -->
					<p id="no-users-or-error" class="text-muted text-center" hidden></p>

					<ul id="users-list" class="list-group">
						<!-- Users will be dynamically added here -->
					</ul>
				</div>

				<form class="panel-form" onsubmit="createUser(event)">
					<div class="mb-2">
						<input
							type="text"
							id="user-id"
							class="form-control"
							placeholder="User ID (e.g. alice)"
							minlength="5"
							maxlength="20"
							pattern="[a-z0-9_]+"
							title="5-20 characters: lowercase letters, numbers and underscores only"
							required
						/>
					</div>
					<div class="mb-2">
						<input type="text" id="user-name" class="form-control" placeholder="Name (e.g. Alice Smith)" required />
					</div>
					<div class="mb-2">
						<input
							type="password"
							id="user-password"
							class="form-control"
							placeholder="Password (min 5 chars)"
							minlength="5"
							required
						/>
					</div>

					<!-- Error message -->
					<div id="create-user-error" class="alert alert-danger" hidden></div>

					<button type="submit" class="btn btn-primary w-100">Create User</button>
				</form>
			</div>

			<!-- Rooms panel -->
			<div class="panel">
				<h2 class="text-center text-primary">Rooms</h2>

				<div class="panel-list">
					<!-- Message when there are no rooms or an error occurs while loading -->
					<p id="no-rooms-or-error" class="text-muted text-center" hidden></p>

					<ul id="rooms-list" class="list-group">
						<!-- Rooms will be dynamically added here -->
					</ul>
				</div>

				<form class="panel-form" onsubmit="createRoom(event)">
					<div class="mb-2">
						<input type="text" id="room-name" class="form-control" placeholder="Room name" required />
					</div>

					<!-- Error message -->
					<div id="create-room-error" class="alert alert-danger" hidden></div>

					<button type="submit" class="btn btn-primary w-100">Create Room</button>
				</form>
			</div>
		</div>

		<!-- MEMBERS VIEW -->
		<div id="members" hidden>
			<div id="members-header">
				<button class="icon-button" title="Back" onclick="backToHome()">
					<i class="fa-solid fa-arrow-left"></i>
				</button>
				<h2 id="members-room-name" class="text-primary"></h2>
				<button class="btn btn-primary btn-sm" onclick="joinAsUser()">Join as user</button>
			</div>

			<!-- Add member forms: a user (from the existing users) or an identified guest (by name) -->
			<div id="add-member-forms">
				<form class="add-member-form" onsubmit="addUser(event)">
					<select id="member-user" class="form-select" required>
						<!-- Users will be dynamically added here -->
					</select>
					<select id="member-user-role" class="form-select">
						<option value="speaker">Speaker</option>
						<option value="moderator">Moderator</option>
					</select>
					<button type="submit" class="btn btn-success">Add user</button>
				</form>

				<form class="add-member-form" onsubmit="addGuest(event)">
					<input type="text" id="guest-name" class="form-control" placeholder="Guest name (e.g. Charlie)" required />
					<select id="guest-role" class="form-select">
						<option value="speaker">Speaker</option>
						<option value="moderator">Moderator</option>
					</select>
					<button type="submit" class="btn btn-success">Add guest</button>
				</form>
			</div>

			<!-- Error message -->
			<div id="add-member-error" class="alert alert-danger" hidden></div>

			<!-- Members list -->
			<div id="members-list">
				<!-- Message when there are no members or an error occurs while loading -->
				<p id="no-members-or-error" class="text-muted text-center" hidden></p>

				<ul class="list-group">
					<!-- Members will be dynamically added here -->
				</ul>
			</div>

			<p class="members-hint text-muted">
				<strong>Users</strong> join by clicking <strong>Join as user</strong> and logging in with their OpenVidu
				Meet credentials (their User ID and password). <strong>Identified guests</strong> join through their own
				unique link (use the join button next to each guest), with no login required.
			</p>
		</div>

		<!-- ROOM VIEW -->
		<div id="room" hidden>
			<div id="meeting-container">
				<!-- The OpenVidu Meet WebComponent will be inserted here when user joins a room -->
				<!-- <openvidu-meet room-url="..."></openvidu-meet>-->
			</div>
		</div>

		<script src="js/app.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<!-- OpenVidu Meet WebComponent bundle -->
		<script src="http://localhost:9080/meet/v1/openvidu-meet.js"></script>
	</body>
</html>
